    <script>
      // Compatibility patch for sandboxed iframe environments / tools that reassign window.fetch
      (function() {
        try {
          var currentFetch = window.fetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(fn) { currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (_) {}

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() { return currentFetch; },
                set: function(fn) { currentFetch = fn; },
                configurable: true,
                enumerable: true
              });
            } catch (_) {}
          }
        } catch (_) {}

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
            event.preventDefault();
          }
        });
      })();
    </script>
